name: Build Stock Kernel C v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: light_defconfig

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            gawk \
            git \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libssl-dev \
            lld \
            python3 \
            unzip \
            wget \
            zip \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu

      - name: Download Android Clang r383902
        run: |
          mkdir -p "$GITHUB_WORKSPACE/clang"

          cd "$GITHUB_WORKSPACE/clang"

          wget -O clang.tar.gz \
          "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/3857008389202edac32d57008bb8c99d2c957f9d/clang-r383902.tar.gz"

          tar -xzf clang.tar.gz

      - name: Verify Android Clang
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/clang/lib64:$LD_LIBRARY_PATH"

          echo "========== PATH =========="
          which clang
          which ld.lld
          which llvm-ar

          echo
          echo "========== VERSION =========="
          clang --version
          ld.lld --version
          llvm-ar --version
          llvm-nm --version
          llvm-objdump --version
      - name: Clone Xiaomi Kernel Source
        run: |
          git clone \
            --depth=1 \
            --branch light-u-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource \
            kernel

      # Stock vendor .ko modules (wmt_drv.ko, wlan_drv_gen4m.ko, etc.) only
      # load on a kernel whose vermagic string matches EXACTLY. Stock is
      # "4.19.191-perf-gb889dbe59f09" (no -dirty suffix). Writing
      # .scmversion makes scripts/setlocalversion use this verbatim
      # instead of computing it from git state (which would differ and
      # also pick up "-dirty" since our patch steps modify the tree
      # without committing).
      - name: Match Stock Kernel Version String
        working-directory: kernel
        run: |
          echo "-gb889dbe59f09" > .scmversion
          cat .scmversion

      - name: Setup KernelSU (non-GKI, manual hook)
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s main
          echo "========== KernelSU source =========="
          ls -la KernelSU 2>/dev/null || ls -la drivers/kernelsu 2>/dev/null || echo "KSU dir not found under expected paths"

      - name: Manually Integrate KernelSU Hooks (non-GKI, no kprobe)
        working-directory: kernel
        run: |
          set -e
          echo "===== Patching fs/exec.c ====="
          if ! grep -q "ksu_handle_execveat" fs/exec.c; then
            python3 - << 'PYEXEC'
          import re
          path = "fs/exec.c"
          with open(path) as f:
              content = f.read()

          decl = '''#ifdef CONFIG_KSU
          extern bool ksu_execveat_hook __read_mostly;
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,
          			     void *envp, int *flags);
          extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,
          			     void *argv, void *envp, int *flags);
          #endif
          '''

          # Insert declarations right before do_execveat_common's definition,
          # and the hook call as the first statement inside its body.
          pattern = re.compile(
              r'(static int do_execveat_common\([^)]*\)\s*\n\{\n)'
          )
          m = pattern.search(content)
          if m:
              insert_point = m.start()
              body_start = m.end()
              hook_call = (
                  "#ifdef CONFIG_KSU\n"
                  "\tif (unlikely(ksu_execveat_hook))\n"
                  "\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                  "\telse\n"
                  "\t\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);\n"
                  "#endif\n"
              )
              content = content[:insert_point] + decl + content[insert_point:body_start] + hook_call + content[body_start:]
              with open(path, "w") as f:
                  f.write(content)
              print("Patched fs/exec.c: do_execveat_common hook inserted")
          else:
              print("WARNING: do_execveat_common signature not found verbatim in fs/exec.c — manual inspection needed")
          PYEXEC
          else
            echo "fs/exec.c already patched, skipping"
          fi

          echo "===== Patching fs/open.c (faccessat) ====="
          if ! grep -q "ksu_handle_faccessat" fs/open.c; then
            python3 - << 'PYOPEN'
          import re
          path = "fs/open.c"
          with open(path) as f:
              content = f.read()

          decl = (
              "#ifdef CONFIG_KSU\n"
              "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode,\n"
              "\t\t\t\t  int *flags);\n"
              "#endif\n\n"
          )

          pattern = re.compile(
              r'(SYSCALL_DEFINE3\(faccessat, int, dfd, const char __user \*, filename, int, mode\)\s*\n\{\n)'
          )
          m = pattern.search(content)
          if m:
              insert_point = m.start()
              body_start = m.end()
              hook_call = (
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
                  "#endif\n"
              )
              content = content[:insert_point] + decl + content[insert_point:body_start] + hook_call + content[body_start:]
              with open(path, "w") as f:
                  f.write(content)
              print("Patched fs/open.c: faccessat hook inserted")
          else:
              print("WARNING: SYSCALL_DEFINE3(faccessat...) signature not found verbatim in fs/open.c — manual inspection needed")
          PYOPEN
          else
            echo "fs/open.c already patched, skipping"
          fi

          echo "===== Patching fs/devpts/inode.c (terminal command fix) ====="
          if [ -f fs/devpts/inode.c ] && ! grep -q "ksu_handle_devpts" fs/devpts/inode.c; then
            python3 - << 'PYDEVPTS'
          import re
          path = "fs/devpts/inode.c"
          with open(path) as f:
              content = f.read()

          decl = "#ifdef CONFIG_KSU\nextern int ksu_handle_devpts(struct inode*);\n#endif\n\n"

          pattern = re.compile(r'(void \*devpts_get_priv\(struct dentry \*dentry\)\s*\n\{\n)')
          m = pattern.search(content)
          if m:
              insert_point = m.start()
              body_start = m.end()
              hook_call = "#ifdef CONFIG_KSU\n\tksu_handle_devpts(dentry->d_inode);\n#endif\n"
              content = content[:insert_point] + decl + content[insert_point:body_start] + hook_call + content[body_start:]
              with open(path, "w") as f:
                  f.write(content)
              print("Patched fs/devpts/inode.c: devpts hook inserted")
          else:
              print("WARNING: devpts_get_priv signature not found verbatim — manual inspection needed (non-fatal, only affects terminal pm command)")
          PYDEVPTS
          else
            echo "fs/devpts/inode.c already patched or not found, skipping"
          fi

      - name: Verify Source
        working-directory: kernel
        run: |
          echo "========== SOURCE =========="
          git log -1 --oneline

          echo
          make kernelversion

      # Must land at $GITHUB_WORKSPACE/vendor/mediatek/kernel_modules —
      # a SIBLING of kernel/ — because drivers/misc/mediatek/connectivity/Makefile
      # resolves it via $(srctree)/../vendor/mediatek/kernel_modules/connectivity
      - name: Clone MTK Connectivity Modules (WiFi/BT/Hotspot source)
        run: |
          git clone \
            --depth=1 \
            --branch light-u-oss \
            https://github.com/MiCode/MTK_kernel_modules \
            vendor/mediatek/kernel_modules

          echo "========== Verify overlay landed correctly =========="
          ls -la vendor/mediatek/kernel_modules/connectivity/

      - name: Patch MTK WLAN Driver Source (all fixes)
        run: |
          set -e
          H="vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/include/nic_cmd_event.h"
          C="vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/nic/nic_cmd_event.c"

          # Force MTK_PLATFORM to mt6833 (correct chip) ONLY within
          # connectivity's own Kbuild — a command-line override would
          # leak into audio/clkbuf builds too (only mt6853 source exists
          # there) and break them, since command-line make vars apply
          # globally with top priority. A plain assignment at the top
          # of this one Kbuild file stays scoped to just this file.
          CONN_KBUILD="vendor/mediatek/kernel_modules/connectivity/common/Kbuild"
          if [ -f "$CONN_KBUILD" ] && ! grep -q "^MTK_PLATFORM := mt6833" "$CONN_KBUILD"; then
            sed -i '1i MTK_PLATFORM := mt6833' "$CONN_KBUILD"
            echo "Patched (forced MTK_PLATFORM=mt6833, scoped): $CONN_KBUILD"
          fi

          GEN4M_MK_PLAT="vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/Makefile"
          if [ -f "$GEN4M_MK_PLAT" ] && ! grep -q "^MTK_PLATFORM := mt6833$" "$GEN4M_MK_PLAT"; then
            sed -i 's/^MTK_PLATFORM := \$(subst \$(quote),,\$(CONFIG_MTK_PLATFORM))$/MTK_PLATFORM := $(subst $(quote),,$(CONFIG_MTK_PLATFORM))\nMTK_PLATFORM := mt6833/' "$GEN4M_MK_PLAT"
            echo "Patched (forced MTK_PLATFORM=mt6833, scoped): $GEN4M_MK_PLAT"
          fi

          for f in \
            vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/os/linux/include/gl_qa_agent.h \
            vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/os/none/include/gl_qa_agent.h
          do
            if [ -f "$f" ] && ! grep -q "define LIST_SEG_MAX" "$f"; then
              python3 - "$f" << 'PYSHIM'
          import sys
          path = sys.argv[1]
          shim = '''#ifndef LIST_SEG_MAX
          #define LIST_SEG_MAX 100
          #endif
          #ifndef SERV_STATUS_AGENT_INVALID_LEN
          #define SERV_STATUS_AGENT_INVALID_LEN 0x0103
          #endif
          #ifndef GL_QA_AGENT_WLAN_SERVICE_SHIM
          #define GL_QA_AGENT_WLAN_SERVICE_SHIM
          struct list_mode_rx_status {
          \tuint32_t u4RXOK;
          \tuint32_t u4FCSErr;
          \tuint32_t u4RSSI0;
          \tuint32_t u4RSSI1;
          };
          struct list_mode_event {
          \tuint16_t u2Status;
          \tuint32_t u4ExtId;
          \tuint32_t u4SegNumTotal;
          \tuint32_t u4SegNumRead;
          \tunion {
          \t\tuint32_t u4TxStatus[LIST_SEG_MAX];
          \t\tstruct list_mode_rx_status tRxStatus[LIST_SEG_MAX];
          \t};
          };
          #endif
          '''
          with open(path) as f:
              content = f.read()
          with open(path, 'w') as f:
              f.write(shim + content)
          print("Patched:", path)
          PYSHIM
            fi
          done

          for f in \
            vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/os/linux/gl_kal.c \
            vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/include/mgmt/eht_ie.h
          do
            if [ -f "$f" ] && ! grep -q "define GNU_PACKED" "$f"; then
              sed -i '1i #ifndef GNU_PACKED\n#define GNU_PACKED __packed\n#endif' "$f"
              echo "Patched: $f"
            fi
          done

          if [ -f "$H" ]; then
            sed -i '/CONFIG_WLAN_SERVICE == 1/d' "$H"
            echo "Patched: $H"
          fi
          if [ -f "$C" ]; then
            sed -i '/CONFIG_WLAN_SERVICE == 1/d' "$C"
            echo "Patched: $C"
          fi

          if [ -f "$C" ] && ! grep -q '#include "fw_dl.h"' "$C"; then
            sed -i 's/#include "gl_ate_agent.h"/#include "gl_ate_agent.h"\n#include "fw_dl.h"\n#include "gl_qa_agent.h"/' "$C"
            echo "Patched includes: $C"
          fi

          STP_UART="vendor/mediatek/kernel_modules/connectivity/common/common_main/linux/stp_uart.c"
          if [ -f "$STP_UART" ]; then
            sed -i 's/^spinlock_t buf_lock;/static spinlock_t buf_lock __maybe_unused;/' "$STP_UART"
            echo "Patched (static buf_lock): $STP_UART"
          fi

          GL_KAL="vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/os/linux/gl_kal.c"
          if [ -f "$GL_KAL" ]; then
            sed -i 's/^const struct firmware \*fw_entry;/static const struct firmware *fw_entry;/' "$GL_KAL"
            echo "Patched (static fw_entry): $GL_KAL"
          fi

          GEN4M_MK="vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/Makefile"
          if [ -f "$GEN4M_MK" ] && grep -q "filter MTK_WCN_REMOVE_KERNEL_MODULE" "$GEN4M_MK"; then
            python3 - "$GEN4M_MK" << 'PYEOF3'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          old = (
              "ifneq ($(filter MTK_WCN_REMOVE_KERNEL_MODULE,$(KBUILD_SUBDIR_CCFLAGS)),)\n"
              "    ccflags-y += -DCFG_BUILT_IN_DRIVER=1\n"
              "else\n"
              "    ccflags-y += -DCFG_BUILT_IN_DRIVER=0\n"
              "endif"
          )
          new = "ccflags-y += -DCFG_BUILT_IN_DRIVER=1"
          if old in content:
              content = content.replace(old, new)
              with open(path, 'w') as f:
                  f.write(content)
              print("Patched CFG_BUILT_IN_DRIVER (forced =1):", path)
          else:
              print("WARNING: CFG_BUILT_IN_DRIVER block not found verbatim, skipping")
          PYEOF3
          fi

          C2="vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/nic/nic_cmd_event.c"
          python3 - "$C2" << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          old = '''void nicCmdEventListmode(IN struct ADAPTER
          \t\t\t\t  *prAdapter, IN struct CMD_INFO *prCmdInfo,
          \t\t\t\t  IN uint8_t *pucEventBuf)
          {
          \tstruct list_mode_event *prStatus;
          \tstruct GLUE_INFO *prGlueInfo;
          \tuint32_t u4QueryInfoLen;

          \tASSERT(prAdapter);
          \tASSERT(prCmdInfo);

          \tprStatus = (struct list_mode_event *) pucEventBuf;

          \tif (prCmdInfo->fgIsOid) {
          \t\tprGlueInfo = prAdapter->prGlueInfo;

          \t\tu4QueryInfoLen = sizeof(struct list_mode_event);

          \t\t/* Memory copy length is depended on upper-layer */
          \t\tkalMemCopy(&g_HqaListModeStatus, prStatus, u4QueryInfoLen);

          \t\t/* Update Query Information Length */
          \t\tkalOidComplete(prGlueInfo, prCmdInfo,
          \t\t\t       u4QueryInfoLen, WLAN_STATUS_SUCCESS);
          \t}
          }'''
          new = '''void nicCmdEventListmode(IN struct ADAPTER
          \t\t\t\t  *prAdapter, IN struct CMD_INFO *prCmdInfo,
          \t\t\t\t  IN uint8_t *pucEventBuf)
          {
          \t/* Patched: HQA list-mode diagnostic stubbed out (needs
          \t * CONFIG_WLAN_SERVICE's full struct list_mode_event definition)
          \t */
          }'''
          if old in content:
              content = content.replace(old, new)
              with open(path, 'w') as f:
                  f.write(content)
              print("Patched nicCmdEventListmode body:", path)
          else:
              print("WARNING: nicCmdEventListmode block not found verbatim, skipping")
          PYEOF

      - name: Set Build Environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "DEFCONFIG=light_defconfig" >> $GITHUB_ENV

      - name: Apply Required OSS Compile Fixes
        working-directory: kernel
        run: |
          set -e

          mkdir -p vendor/xiaomi/kernel_modules/mihw

          cat > vendor/xiaomi/kernel_modules/mihw/Makefile << 'EOF'
          obj-y :=
          EOF

          sed -i '/vendor\/xiaomi\/kernel_modules\/mihw/d' drivers/mihw/Makefile || true
          sed -i 's/obj-$(CONFIG_MI_HARDWARE) += mihw.o//g' drivers/Makefile || true
          sed -i 's/subdir-ccflags-y += -Werror/subdir-ccflags-y += -Wno-error/' \
          drivers/input/touchscreen/mediatek/Makefile
          echo "===== Touchscreen Makefile ====="
          head -5 drivers/input/touchscreen/mediatek/Makefile

          echo "===== NOT changing CONFIG_MTK_PLATFORM globally ====="
          echo "(audio scp_vow and clkbuf_v1 only have mt6853 source present;"
          echo " connectivity gets mt6833 via MTK_PLATFORM= on the make command line instead)"

          echo "===== Adding KernelSU (manual hook) config flags ====="
          CONFIG_FILE="arch/arm64/configs/$DEFCONFIG"
          cat >> "$CONFIG_FILE" << 'KSUEOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_MODVERSIONS=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          KSUEOF
          echo "===== Final defconfig KSU section ====="
          grep "KSU\|KALLSYMS" "$CONFIG_FILE"

      - name: Generate Kernel Config
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          make O="$GITHUB_WORKSPACE/build-out" "$DEFCONFIG"

          yes "" | make O="$GITHUB_WORKSPACE/build-out" olddefconfig || true

      - name: Verify Config
        working-directory: kernel
        run: |
          echo "========== Kernel Config =========="

          test -f ../build-out/.config

          ls -lh ../build-out/.config

          grep CONFIG_LOCALVERSION ../build-out/.config || true
          grep CONFIG_LTO_CLANG ../build-out/.config || true
          grep CONFIG_CFI_CLANG ../build-out/.config || true

          echo
          echo "========== CONFIG READY =========="
      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/clang/lib64:$LD_LIBRARY_PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "========== TOOLCHAIN =========="
          which clang
          clang --version

          echo "========== BUILD =========="

          make V=1 -j"$(nproc)" \
            O="$GITHUB_WORKSPACE/build-out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_WLAN_DRV_BUILD_IN=y \
            MTK_ANDROID_EMI=y \
            MTK_COMBO_CHIP=SOC2_2X2 \
            Image \
            Image.gz \
            vmlinux \
            modules \
            dtbs

      - name: Verify WiFi/Connectivity Actually Compiled
        working-directory: kernel
        run: |
          echo "========== connadp / wmt_drv / wlan_drv_gen4m symbols in vmlinux =========="
          nm ../build-out/vmlinux 2>/dev/null | grep -iE "wmt_drv_init|wlan_probe|connadp" | head -20 \
            || echo "WARNING: expected WiFi/WMT symbols NOT found"

      - name: Verify KernelSU Actually Compiled
        working-directory: kernel
        run: |
          echo "========== KernelSU symbols in vmlinux =========="
          nm ../build-out/vmlinux 2>/dev/null | grep -iE "ksu_|kernelsu" | head -20 \
            || echo "WARNING: expected KernelSU symbols NOT found"

      - name: Verify Build Outputs
        working-directory: kernel
        run: |
          echo "========== OUTPUT =========="

          ls -lah ../build-out/arch/arm64/boot/

          test -f ../build-out/arch/arm64/boot/Image
          test -f ../build-out/arch/arm64/boot/Image.gz

          ls -lh ../build-out/.config || true
          ls -lh ../build-out/System.map || true
          ls -lh ../build-out/Module.symvers || true
          ls -lh ../build-out/vmlinux || true

      - name: Print Build Information
        working-directory: kernel
        run: |
          echo "========== IMAGE =========="
          file ../build-out/arch/arm64/boot/Image
          file ../build-out/arch/arm64/boot/Image.gz

          echo
          echo "========== SIZE =========="
          du -h ../build-out/arch/arm64/boot/Image
          du -h ../build-out/arch/arm64/boot/Image.gz
          du -h ../build-out/vmlinux || true

      - name: List Important Files
        working-directory: kernel
        run: |
          find ../build-out -maxdepth 2 -type f | sort
      - name: Download Stock Boot
        run: |
          wget -O boot.img \
          https://github.com/yadavmandeep8899-wq/Poco-m4-stock-kernel/releases/download/Boot/boot.img

      - name: Download MagiskBoot
        run: |
          wget -O magiskboot \
          https://github.com/yadavmandeep8899-wq/Poco-m4-stock-kernel/releases/download/Boot/magiskboot

          chmod +x magiskboot

      - name: Analyze Stock Boot
        run: |
          mkdir stock

          cp boot.img stock/
          cp magiskboot stock/

          cd stock

          ./magiskboot unpack boot.img

          echo "========== Stock Boot =========="
          ls -lh

          file kernel || true
          file kernel_dtb || true
          file dtb || true

      - name: Repack Stock Boot
        run: |
          mkdir work

          cp boot.img work/
          cp magiskboot work/

          cd work

          ./magiskboot unpack boot.img

          if [ -f ../build-out/arch/arm64/boot/Image.gz ]; then
              cp ../build-out/arch/arm64/boot/Image.gz kernel
          elif [ -f ../build-out/arch/arm64/boot/Image ]; then
              cp ../build-out/arch/arm64/boot/Image kernel
          else
              echo "Kernel image not found!"
              exit 1
          fi

          if [ -f ../build-out/arch/arm64/boot/dtb.img ]; then
              cp ../build-out/arch/arm64/boot/dtb.img dtb
          fi

          ./magiskboot repack boot.img

          mv new-boot.img ../patched_boot.img

      - name: Verify Patched Boot
        run: |
          ls -lh patched_boot.img
          sha1sum patched_boot.img

      - name: Upload Patched Boot
        uses: actions/upload-artifact@v4
        with:
          name: patched-stock-boot
          path: patched_boot.img

      - name: Upload Kernel Files
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-files
          path: |
            build-out/.config
            build-out/System.map
            build-out/Module.symvers
            build-out/vmlinux
            build-out/arch/arm64/boot/Image*
            build-out/arch/arm64/boot/dtb*
