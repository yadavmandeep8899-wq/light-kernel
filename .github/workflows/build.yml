name: Xiaomi Light Kernel Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      LLVM: 1
      LLVM_IAS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: light-u-oss
          path: kernel
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev liblz4-tool libncurses-dev libssl-dev python3 python-is-python3 rsync unzip zip device-tree-compiler
      - name: Download Android Clang
        run: |
          mkdir -p toolchain
          cd toolchain

          curl -L -o clang.tar.gz \
          "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/b669748458572622ed716407611633c5415da25c/clang-r416183b.tar.gz"

           echo "===== FILE TYPE ====="
          file clang.tar.gz

           echo "===== ARCHIVE CONTENT ====="
           tar -tf clang.tar.gz | head -20

           mkdir clang
           tar -xzf clang.tar.gz -C clang

           echo "$GITHUB_WORKSPACE/toolchain/clang/bin" >> $GITHUB_PATH
      - name: Verify
        run: |
          clang --version || true
          make --version
          python3 --version
      - name: Defconfig
        working-directory: kernel
        run: make O=../out ARCH=arm64 LLVM=1 LLVM_IAS=1 light_defconfig
      - name: Build
        working-directory: kernel
        run: make -j$(nproc) O=../out ARCH=arm64 LLVM=1 LLVM_IAS=1
      - name: Collect
        if: always()
        run: |
          mkdir -p artifacts
          cp -f out/.config artifacts/ 2>/dev/null || true
          cp -f out/vmlinux artifacts/ 2>/dev/null || true
          cp -f out/System.map artifacts/ 2>/dev/null || true
          cp -f out/Module.symvers artifacts/ 2>/dev/null || true
          cp -f out/arch/arm64/boot/Image* artifacts/ 2>/dev/null || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: light-kernel-output
          path: artifacts
